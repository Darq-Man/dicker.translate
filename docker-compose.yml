services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: Dicker-UI
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on: 
      - backend
    
  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: Dicker-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"